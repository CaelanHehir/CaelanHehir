name: Keep-alive commit

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:  # allows manual trigger
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main  # <- branch to commit to

      - name: Write random content
        run: |
          mkdir -p .keepalive
          echo "$(date -u +%Y-%m-%dT%H:%M:%SZ) $RANDOM - still alive" >> .keepalive/log.txt

      - name: Commit and push
        run: |
          git config user.name "CaelanHehir"
          git config user.email "caelanhehir@gmail.com"
          git add .keepalive/log.txt
          git commit -m "chore: keep-alive commit" || echo "Nothing to commit"
          git push origin keep-alive

name: Keep-alive commit

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch: # allows manual trigger
  push:
    branches:
      - main

jobs:
  commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: keep-alive   # <- branch to commit to

      - name: Write random content
        run: |
          mkdir -p .keepalive
          echo "$(date -u +%Y-%m-%dT%H:%M:%SZ) $RANDOM - still alive" >> .keepalive/log.txt

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .keepalive/log.txt
          git commit -m "chore: keep-alive commit" || echo "Nothing to commit"
          git push origin keep-alive
